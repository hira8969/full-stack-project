<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::section})}">

<body>

<section class="signup-section py-5">

```
<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-10 col-lg-8">

            <div class="card shadow border-0">

                <div class="card-body p-5">

                    <!-- Logo/Image -->
                    <div class="text-center mb-4">
                        <img th:src="@{/img/membership.png}"
                             alt="Membership"
                             class="img-fluid"
                             style="max-width:180px;">
                    </div>

                    <h2 class="text-center mb-2">
                        Create Your Account
                    </h2>

                    <p class="text-center text-muted mb-4">
                        Join Smart Contact Management and manage your contacts efficiently.
                    </p>

                    <!-- Success/Error Message -->
                    <div th:if="${session.messege}"
                         class="alert alert-primary text-center"
                         th:text="${session.messege}">
                    </div>

                    <form th:action="@{/do_register}"
                          method="post"
                          th:object="${user}">

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Full Name
                            </label>

                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   placeholder="Enter your full name"
                                   required
                                   th:value="*{name}">
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Email Address
                            </label>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Enter your email"
                                   required
                                   th:value="*{email}">
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Password
                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Create a strong password"
                                   required>
                        </div>

                        <!-- About -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                About Yourself
                            </label>

                            <textarea class="form-control"
                                      name="about"
                                      rows="4"
                                      placeholder="Tell us something about yourself..."
                                      th:text="*{about}">
                            </textarea>
                        </div>

                        <!-- Default Image -->
                        <input type="hidden"
                               name="imageUrl"
                               value="membership.png">

                        <!-- Terms & Conditions -->
                        <div class="form-check mb-4">
                            <input class="form-check-input"
                                   type="checkbox"
                                   name="agreement"
                                   value="true"
                                   required>

                            <label class="form-check-label">
                                I accept the Terms & Conditions
                            </label>
                        </div>

                        <!-- Buttons -->
                        <div class="text-center">

                            <button type="submit"
                                    class="btn btn-primary px-4 me-2">
                                Register
                            </button>

                            <button type="reset"
                                    class="btn btn-secondary px-4">
                                Reset
                            </button>

                        </div>

                    </form>

                    <hr class="my-4">

                    <p class="text-center mb-0">
                        Already have an account?
                        <a th:href="@{/signin}" class="text-decoration-none">
                            Sign In
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>
```

</section>

</body>
</html>
