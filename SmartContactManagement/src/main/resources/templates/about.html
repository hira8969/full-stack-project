<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::section})}">

<body>

<section>

    <div class="container mt-5">

        <div class="card shadow">
            <div class="card-body text-center">

                <h1 class="display-5 text-primary">
                    About Smart Contact Manager
                </h1>

                <p class="lead mt-3">
                    Smart Contact Manager is a web application that helps users
                    store, manage, update, and organize their contacts securely.
                </p>

                <hr>

                <h3>Features</h3>

                <ul class="list-group list-group-flush mt-3">
                    <li class="list-group-item">Add New Contacts</li>
                    <li class="list-group-item">Update Contact Information</li>
                    <li class="list-group-item">Delete Contacts</li>
                    <li class="list-group-item">Secure User Authentication</li>
                    <li class="list-group-item">Profile Management</li>
                </ul>

                <div class="mt-4">
                    <a href="/" class="btn btn-primary">
                        Back to Home
                    </a>
                </div>

            </div>
        </div>

    </div>

</section>

</body>
</html>
