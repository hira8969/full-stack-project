<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::section})}">

<body>

<section class="signup-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow">

                    <div class="card-body p-5">

                        <h2 class="text-center mb-4">
                            Create Your Account
                        </h2>

                        <form th:action="@{/do_register}" method="post" th:object="${user}">
                            <div class="mb-3">
                                <label class="form-label">
                                    Full Name
                                </label>

                                <input type="text" name="name" class="form-control" placeholder="Enter your name" required th:value="*{name}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Email Address
                                </label>

                                <input type="email" name="email" class="form-control" placeholder="Enter your email" required th:value="*{email}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">
                                    Password
                                </label>

                                <input type="password" name="password" class="form-control" placeholder="Enter password"
                                 required>
                            </div>

                            <div class="mb-3" th:if="${user.about != null}">
                                <label class="form-label">
                                    About Yourself
                                </label>

                                <textarea class="form-control" name="about" rows="4" th:text="*{about}"></textarea>
                            </div>
                            <!-- terms and conditions -->
                            <div class="form-check mb-3">

                                <input class="form-check-input" type="checkbox" required>

                                <label class="form-check-label">
                                    Accept Terms & Conditions
                                </label>

                            </div>

                            <div class="text-center">

                                <button type="submit"class="btn btn-primary px-4">
                                    Register
                                </button>

                                <button type="reset" class="btn btn-secondary px-4">
                                    Reset
                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

</body>
</html>
