<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{::section})}">

<body>

<section class="login-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow">

                    <div class="card-body p-5">

                        <h2 class="text-center mb-4">
                            Login
                        </h2>

                        <form th:action="@{/login}"
                              method="post">

                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       name="username"
                                       class="form-control"
                                       required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                       name="password"
                                       class="form-control"
                                       required>

                            </div>

                            <div class="text-center">

                                <button type="submit"
                                        class="btn btn-primary w-100">
                                    Login
                                </button>

                            </div>

                        </form>

                        <hr>

                        <p class="text-center">

                            Don't have an account?

                            <a th:href="@{/signup}">
                                Register Here
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

</body>
</html>
